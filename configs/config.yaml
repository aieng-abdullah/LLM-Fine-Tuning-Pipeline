model:
  name: "gpt2-medium"

data:
  csv_path: "./Sci-Fi-Books-gutenberg/sci-fi-books.csv"
  text_column: "text"
  val_split_ratio: 0.2
  max_seq_length: 512

training:
  output_dir: "./outputs"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  report_to: "none"
  seed: 42

inference:
  max_new_tokens: 200
  temperature: 0.8
  top_p: 0.9
  repetition_penalty: 1.1